let chosenPort=null,editChosenPort=null,portSearchResults=[];let token='',state=null,active='trips';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fullDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));if(!m)return String(s||'날짜 미확인');const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));if(d.getFullYear()!==Number(m[1])||d.getMonth()!==Number(m[2])-1||d.getDate()!==Number(m[3]))return String(s);return `${m[1]}년 ${Number(m[2])}월 ${Number(m[3])}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`};// 7/8물때식: 음력 날짜 기반의 관용 물때명. 실제 조석 예보(API)와 별개입니다.
const tideFromDate=date=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'')))return null;
  try{
    const parts=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric',timeZone:'Asia/Seoul'}).formatToParts(new Date(date+'T03:00:00Z'));
    const day=Number(parts.find(x=>x.type==='day')?.value);
    if(!Number.isInteger(day)||day<1||day>30)return null;
    const n=((day-1)%15)+1;
    const seven=n===8?'조금':n===9?'무시':n<=7?(n+6)+'물':n<=15?(n-9)+'물':'';
    const eight=n===8?'조금':n<=7?(n+7)+'물':n<=15?(n-8)+'물':'';
    return {seven,eight,lunarDay:day};
  }catch(e){return null}
};
const tideText=t=>{const v=tideFromDate(t?.date);return v?`7물때식: ${esc(v.seven)} · 8물때식: ${esc(v.eight)}`:'물때: 계산 불가 (날짜 확인)'};
const tideDetail=t=>{const v=tideFromDate(t?.date);return v?`7물때식 ${esc(v.seven)} / 8물때식 ${esc(v.eight)} <span class="muted">(음력일 기반 계산)</span>`:'물때 계산 불가'};
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const pendingMember=()=>state?.profile?.status==='pending';const admin=()=>Boolean(state?.profile&&['admin','staff'].includes(state.profile.role));const superAdmin=()=>Boolean(state?.profile&&state.profile.role==='admin');const canEditTrip=t=>Boolean(t&&(admin()||(String(t.creatorId||'').trim()&&String(t.creatorId)===String(state?.profile?.id))));const todayKst=()=>state?.todayKst||new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const isPastTrip=t=>Boolean(t?.date&&String(t.endDate||t.date)<todayKst());const visibleTrips=()=>Array.isArray(state?.trips)?state.trips.filter(t=>t.status!=='deleted'&&!isPastTrip(t)):[];const validMyTrips=()=>Array.isArray(state?.trips)?state.trips.filter(t=>t.status!=='deleted'&&!isPastTrip(t)):[];const tripDateRange=t=>t.endDate&&t.endDate!==t.date?fullDate(t.date)+' ~ '+fullDate(t.endDate):fullDate(t.date);const tripDateDisplay=t=>t.endDate&&t.endDate!==t.date?'<div class="trip-date-line">'+esc(fullDate(t.date))+'</div><div class="trip-date-separator">↓</div><div class="trip-date-line">'+esc(fullDate(t.endDate))+'</div>':'<div class="trip-date-line">'+esc(fullDate(t.date))+'</div>'; const pastTrips=()=>Array.isArray(state?.trips)?state.trips.filter(t=>t.status!=='deleted'&&isPastTrip(t)):[];function msg(s){const el=$('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}
let clubClient;
async function call(fn,unusedToken,...args){
 const {data,error}=await clubClient.auth.getSession();
 if(error||!data.session)throw Error('로그인이 필요합니다.');
 const res=await fetch(BABA.url+'/functions/v1/baba-club',{
   method:'POST',headers:{'Content-Type':'application/json',apikey:BABA.key,Authorization:'Bearer '+data.session.access_token},
   body:JSON.stringify({action:fn,args})
 });
 const body=await res.json();
 if(!res.ok)throw Error(body.error||body.message||'서버 연결에 실패했습니다.');
 return body.result;
}
async function signOut(){
 await clearTripPush().catch(()=>{});
 const {error}=await clubClient.auth.signOut({scope:'local'});
 if(error)return msg(error.message);
 location.replace(location.pathname);
}
function showLoginNotice(text){
 $('appPanel').classList.add('hidden');
 $('loginPanel').classList.remove('hidden');
 $('loginNotice').textContent=text;
 $('loginNotice').hidden=false;
}
function loginFailure(reason){
 if(/rate.limit|too many|429|only request/i.test(reason))return '인증 요청이 많아 잠시 제한되었습니다. 카카오계정 이메일에 도착한 최신 인증 메일을 먼저 확인해 주세요. 메일이 없으면 잠시 후 다시 시도해 주세요.';
 if(/unverified.email|confirmation.email|email.not.confirmed/i.test(reason))return '카카오계정에 등록된 이메일로 인증 메일을 보냈습니다. 메일함과 스팸함에서 최신 메일을 열어 인증한 뒤 이 화면에서 다시 로그인해 주세요.';
 if(/denied|cancel/i.test(reason))return '카카오 로그인이 취소되었습니다. 아래 버튼으로 다시 시작해 주세요.';
 return '로그인을 완료하지 못했습니다. 출조 앱을 연 브라우저에서 아래 버튼을 눌러 다시 로그인해 주세요.';
}
async function kakaoLogin(){
 if(!clubClient){location.reload();return;}
 const button=$('kakaoLoginButton');
 button.disabled=true;
 try{
  const {error}=await clubClient.auth.signInWithOAuth({provider:'kakao',options:{queryParams:{scope:'profile_nickname profile_image'},redirectTo:location.origin+location.pathname}});
  if(error)throw error;
 }catch(e){button.disabled=false;showLoginNotice(loginFailure(e.message))}
}
async function startClub(){
 const url=new URL(location.href);
 const shared=url.searchParams.get('trip');
 if(shared && /^[a-f0-9-]{36}$/i.test(shared))sessionStorage.setItem('baba-shared-trip',shared);
 const fragment=new URLSearchParams(url.hash.slice(1));
 const field=name=>url.searchParams.get(name)||fragment.get(name)||'';
 const code=field('code');
 const failure=[field('error'),field('error_code'),field('error_description')].filter(Boolean).join(' ');
 if(code||failure)history.replaceState({},'',url.pathname);
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.4');
 clubClient=createClient(BABA.url,BABA.key,{auth:{storageKey:'baba-test-auth',flowType:'pkce',detectSessionInUrl:false}});
 if(failure){showLoginNotice(loginFailure(failure));return;}
 if(code){
   const {error}=await clubClient.auth.exchangeCodeForSession(code);
   if(error){showLoginNotice(loginFailure(error.message));return;}
 }
 const {data,error}=await clubClient.auth.getSession();
 if(error)throw error;
 token=data.session?.user.id||'';
 clubClient.auth.onAuthStateChange((event,s)=>{if((s?.user.id||'')!==token)location.reload()});
 await refresh();
}

// 다른 회원이 변경한 출조 일정·신청·승인 상태를 서버에서 다시 조회합니다.
let babaReloading=false;
async function reloadBabaData(){
  if(babaReloading||!token)return;
  babaReloading=true;
  const button=$('reloadDataButton');
  if(button){button.disabled=true;button.textContent='↻ 불러오는 중...';}
  try{
    // 현재 선택한 월별 필터와 메뉴는 유지합니다.
    const result=await call('data',token);
    if(!result||!result.profile||!Array.isArray(result.trips)||!Array.isArray(result.regs))throw new Error('최신 데이터를 불러오지 못했습니다.');
    state=result;rankingYearCache={};rankingPreviewRequest++;
    // 상세 화면을 보고 있던 경우 해당 출조 상세를 다시 표시합니다.
    if(babaScreen?.kind==='detail'&&babaScreen.id){
      const trip=state.trips.find(t=>String(t.id)===String(babaScreen.id));
      if(trip&&trip.status!=='deleted')showTripDetail(babaScreen.id);
      else {active='trips';render();}
    }else render();
    msg('최신 출조 일정과 신청 현황을 불러왔습니다.');
  }catch(e){msg('새로고침 실패: '+(e?.message||e));}
  finally{babaReloading=false;if(button){button.disabled=false;button.textContent='↻ 데이터 새로고침';}}
}
async function refresh(){
  const requestedToken=token;
  try{
    if(!requestedToken){$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');return;}
    // 첫 화면은 최소 인증 정보만 먼저 받아 표시합니다.
    // 최종 데이터가 도착할 때까지 출조 신청/관리 메뉴는 열지 않습니다.
    const result=await call('data',requestedToken,true);
    const quick=result;
    if(token!==requestedToken)return;
    if(!quick||!quick.profile||!quick.profile.id)throw new Error('초기 회원정보를 불러오지 못했습니다.');
    $('loginPanel').classList.add('hidden');
    $('appPanel').classList.remove('hidden');
    $('hello').textContent=quick.profile.nickname+' 님';
    $('role').textContent='출조 정보를 불러오는 중...';
    $('stats').innerHTML='<div class="card kpi" style="grid-column:1/-1">출조 정보를 불러오는 중...</div>';
    $('rankingPreview').innerHTML='';
    $('view').innerHTML='<div class="card"><h2>출조 일정 준비 중</h2><p class="muted">최신 출조·신청·대기 정보를 확인하고 있습니다.</p></div>';
    document.querySelectorAll('.tabs button').forEach(b=>b.disabled=true);

    if(token!==requestedToken)return; // 로그아웃 또는 다른 로그인 이후 도착한 응답은 무시
    if(!result||!result.profile||!result.profile.id||!Array.isArray(result.trips)||!Array.isArray(result.regs)){
      throw new Error('서버에서 회원 정보를 정상적으로 받지 못했습니다. Code.gs 배포 버전과 데이터베이스를 확인해 주세요.');
    }
    state=result;rankingYearCache={};rankingPreviewRequest++;
    document.querySelectorAll('.tabs button').forEach(b=>b.disabled=false);
    updateBabaBack();
    $('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');
    $('hello').textContent=state.profile.nickname+' 님';
    $('role').textContent=pendingMember()?'가입 승인 대기':superAdmin()?'최고관리자':admin()?'운영진 계정':'일반 회원';
    ['create','mine'].forEach(n=>$('tab-'+n).style.display=pendingMember()?'none':'');$('tab-admin').style.display=admin()?'':'none';
    $('tab-roster').style.display='';
    render();
    const sharedId=sessionStorage.getItem('baba-shared-trip');
    if(sharedId){
      sessionStorage.removeItem('baba-shared-trip');
      const trip=state.trips.find(item=>item.id===sharedId && ['open','closed'].includes(item.status));
      if(trip)showTripDetail(trip.id);
      else msg('공유된 일정을 현재 볼 수 없습니다.');
    }
  }catch(e){
    if(token!==requestedToken)return;
    const message=String(e?.message||e||'알 수 없는 오류');
    if(/로그인이 만료|로그인이 필요|비활성화/.test(message)){
      token='';state=null;localStorage.removeItem('baba_token');
      $('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');
    }
    if(token===requestedToken && token){
      $('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');
      $('reloadDataButton').onclick=refresh;
      $('view').innerHTML='<div class="card"><h2>정보 불러오기 실패</h2><p class="muted">데이터 새로고침을 눌러 다시 시도해 주세요.</p></div>';
      document.querySelectorAll('.tabs button').forEach(b=>b.disabled=true);
    }
    msg(message);
  }
}
let babaNavStack=[],babaScreen={kind:'tab',name:'trips'},babaNavigatingBack=false;
function babaPush(next){
  if(!babaNavigatingBack && (babaScreen.kind!==next.kind || babaScreen.name!==next.name || babaScreen.id!==next.id)){
    babaNavStack.push({...babaScreen});if(babaNavStack.length>25)babaNavStack.shift();
  }
  babaScreen=next;updateBabaBack();
}
function updateBabaBack(){const b=$('floatingBack');const visible=Boolean(token&&babaNavStack.length);if(b)b.style.display=visible?'block':'none';document.body.classList.toggle('baba-back-visible',visible)}
function goBabaBack(){
  if(!babaNavStack.length)return;
  const target=babaNavStack.pop();babaNavigatingBack=true;
  try{
    if(target.kind==='detail'){active=target.tab||'trips';showTripDetail(target.id)}
    else if(target.kind==='edit'){active=target.tab||'trips';editTrip(target.id)}
    else if(target.kind==='transfer'){active='mine';transfer(target.id)}
    else if(target.name==='past')showPastTrips();
    else {active=target.name||'trips';babaScreen={kind:'tab',name:active};render()}
  }finally{babaNavigatingBack=false;updateBabaBack()}
}
function tab(name){if(name==='apply')name='trips';if(pendingMember()&&!['trips','ranking','rules','account','roster'].includes(name))return msg('운영진 승인 후 이용할 수 있습니다.');babaPush({kind:'tab',name});active=name;render()}

function showBabaRules(){ $('view').innerHTML = '<div class="card"><div class="baba-rules">'+BABA_RULES_HTML+'</div></div>'; }
const BABA_RULES_HTML = "팀바바(Team BABA Fishing Clubs) 모임 회칙\n\n제1조. 정의\n\n1.팀바바는 낚시 활동과 관련된 각종 정보 및 사항을 공유하고, 회원 간 동반 출조를 목적으로 운영하는 모임이다.\n\n제2조. 가입조건\n\n1.팀바바는 카카오톡 오픈채팅을 중심으로 운영한다.\n\n2.가입에 별도의 제한을 두지 않으며, 팀바바의 목적에 동의하고 활동하고자 하는 사람은 누구나 가입할 수 있다.\n\n제3조. 운영사항\n\n1.팀바바는 방장 1명과 부방장 6명으로 구성된 운영진을 중심으로 운영하는 것을 원칙으로 한다.\n\n2.방장은 매년 11월 선거를 통해 선출하며, 선출된 방장은 부방장 6명을 선임한다. 임기는 다음 해 2년으로 한다.\n\n3.방장 후보 자격에는 별도의 제한을 두지 않으며, 본인의 희망 또는 회원의 추천을 통해 입후보할 수 있다. 방장은 선거를 통해 선출하는 것을 원칙으로 한다.\n\n4.방장은 임의로 자신의 직책을 다른 사람에게 양도할 수 없다.\n\n방장 또는 부방장이 특별한 사유 없이 직책을 내려놓는 경우, 해당 직책의 사임과 함께 팀바바 채팅방에서도 탈퇴하는 것을 원칙으로 한다.\n\n5.방장이 사망 또는 그에 준하는 불가피한 사유로 직책 수행이 불가능한 경우에는 재선거를 통해 후임 방장을 선출한다. 새로 선출된 방장은 부운영진을 새롭게 구성할 수 있다.\n\n6.운영진의 운영 및 활동 과정에서 분열을 일으키거나 이를 조장하여 모임의 정상적인 유지가 어려울 정도의 중대한 문제가 발생한 경우, 전체 회원의 3분의 1 이상이 찬성하면 재선거를 요청할 수 있다.\n\n제4조. 동출모집\n\n1.동출의 정의\n\n동출이란 팀바바 내에서 회원 간에 이루어지는 동반 낚시 출조를 의미하며, 레저보트를 이용한 출조는 제외한다.\n\n2.동출 모집 및 인원\n\n카카오톡 단체방에서 모집하는 동출은 별도의 인원 제한 없이 진행할 수 있다.\n\n3.동출 모집 공지\n\n동출 모집자는 모집 공지에 출조 날짜, 대상 어종, 선사명, 선비, 모집 인원 및 기타 출조 관련 공유사항을 명확하게 기재해야 한다.\n\n4.동출 신청 및 비회원 참여\n\n가. 동출 모집 시 팀바바 회원은 모집 공지 후 바로 신청하는 것을 원칙으로 한다. 다만, 회원의 가족 또는 연인은 회원과 함께 신청할 수 있다.\n\n나. 팀바바 회원이 아닌 사람이 동출 참여를 희망하는 경우에는 모집 공지 시점으로부터 24시간이 경과한 이후 신청할 수 있다.\n\n5.독배 자리 추첨 및 지정\n\n가. 독배 출조의 자리 추첨은 동출일 기준 10일 전까지 진행하는 것을 원칙으로 한다.\n\n나. 자리 추첨을 통해 자리 선택 순서를 정하며, 추첨 순서에 따라 참여자가 원하는 자리를 선택한다.\n\n다. 소수 인원으로 진행하는 동출의 경우에는 출조 상황에 따라 모집자가 별도로 안내할 수 있다.\n\n6.출조 시 자리 준수\n\n가. 출조 당일에는 사전에 선택한 자리에서 낚시하는 것을 원칙으로 하며, 임의로 다른 자리로 이동하여 낚시하는 행위를 금지한다.\n\n나. 선택한 자리가 공석이더라도 임의로 해당 자리로 이동하지 않는 것을 원칙으로 한다.\n\n7.이동 및 동승\n\n팀바바의 동출은 자차 이동을 원칙으로 한다. 다만, 차량 동승 및 이동 방법은 참여 회원 간의 자율적인 협의를 통해 결정할 수 있다.\n\n8.선비 입금 기한 및 미입금 패널티\n\n가. 동출 참여자의 선비 입금은 입금 시작 공지 후 3일 이내에 완료하는 것을 원칙으로 한다.\n\n나. 정당한 사유 없이 기한 내 입금하지 않을 경우 패널티를 부여하며, 해당 패널티가 누적 2회를 초과하면 다음 해 1년간 동출 참여를 제한한다.\n\n9.선비 입금 및 책임 범위\n\n가. 선비는 동출 형태와 관계없이 팀바바 모임통장으로 입금하는 것을 원칙으로 한다.\n\n나. 모집자가 개별 입금을 진행하는 경우 선비 입금 및 정산 과정에서 발생하는 문제는 해당 당사자 간의 문제로 하며, 팀바바 및 운영진은 이에 대한 책임을 지지 않는다.\n\n다. 선비 입금 완료 후 선사의 사정으로 인해 출조가 취소·변경되거나 선비 환불 등 관련 문제가 발생하는 경우, 팀바바 및 운영진에게 그 책임을 묻지 않는 것을 원칙으로 한다.\n\n10.동출 신청 취소 및 양도\n\n가. 선비 입금 전에는 별도의 제한 없이 양도할 수 있다.\n\n나. 선비 입금 후에는 양도자 본인이 양수자를 구하는 것을 원칙으로 한다.\n\n다. 양도자가 직접 양수자를 구하기 어렵거나 양수자의 신원 확인이 필요한 경우, 또는 양도자가 실종되었거나 소재가 파악되지 않는 경우에는 운영진이 해당 상황을 확인한 후 판단에 따라 대리 양도를 진행할 수 있다.\n\n제5조. 회원관리\n\n1.팀바바는 자율적인 친목 모임으로, 회원 간의 개인적인 분쟁에는 관여하지 않는 것을 원칙으로 한다. 다만, 해당 분쟁이 팀바바의 운영이나 활동에 중대한 영향을 미치는 경우 운영진 회의를 통해 필요한 조치를 결정할 수 있다.\n\n2.회원이 팀바바의 원활한 운영을 방해하거나 모임의 질서를 심각하게 훼손하는 경우 운영진 회의를 통해 강제 퇴장 조치를 할 수 있다.\n\n3.팀바바 외부 활동에서 발생한 불법행위 또는 비도덕적 행위가 확인되고, 해당 행위로 인해 팀바바의 명예나 운영에 문제가 발생하는 경우 강제 퇴장 조치를 할 수 있다.\n\n부칙\n\n본 회칙은 회원 간 원활한 소통과 공정한 모임 운영을 위해 적용한다.\n\n회칙에 명시되지 않은 사항은 운영진 회의 및 회원 간 협의를 통해 결정한다.\n\n회칙의 개정이 필요한 경우 운영진 검토 및 회원 의견 수렴을 거쳐 개정할 수 있다.";

async function searchPorts(mode){
 const prefix=mode==='edit'?'edit':'member';
 const input=$(prefix+'PortQuery'),out=$(prefix+'PortResults');
 const q=input.value.trim();
 if(q.length<1){msg('항구명 또는 지역명을 입력하세요.');return;}
 out.innerHTML='<div class="muted" style="padding:12px">검색 중...</div>';
 try{
  const results=await call('searchDeparturePorts',token,q);
  if(out!==$(prefix+'PortResults')||input.value.trim()!==q)return;
  out.innerHTML=results.length?results.map((p,i)=>`<button type="button" class="port-choice" data-port-index="${i}"><b>${esc(p.name)}</b><div class="muted">${esc(p.address)} · ${p.source==='kakao'?'카카오 장소':p.source==='address'?'카카오 주소':'기존 항구 목록'}</div></button>`).join(''):'<div class="muted" style="padding:12px">검색 결과가 없습니다. 아래에서 출항지를 직접 입력할 수 있습니다.</div>';
  out.querySelectorAll('[data-port-index]').forEach(b=>b.onclick=()=>{
   const port=results[Number(b.dataset.portIndex)];
   if(mode==='edit')editChosenPort=port;else chosenPort=port;
   $(prefix+'PortSelected').textContent='선택한 출항지: '+port.name+' · '+port.address;
   out.innerHTML='';input.value=port.name;
  });
 }catch(e){out.innerHTML='';msg(e.message)}
}
function useManualPort(prefix){
 const name=$(prefix+'ManualName').value.trim(), address=$(prefix+'ManualAddress').value.trim();
 if(!name){msg('직접 입력할 출항지 이름을 적어 주세요.');return;}
 const port={name,address,source:'manual'};
 if(prefix==='edit')editChosenPort=port;else chosenPort=port;
 $(prefix+'PortQuery').value=name;
 $(prefix+'PortResults').replaceChildren();
 $(prefix+'PortSelected').textContent='선택한 출항지: '+[name,address].filter(Boolean).join(' · ');
 $(prefix+'ManualName').closest('details').open=false;
}

async function submitMemberTrip(){
  const item={date:$('memberTripDate').value,endDate:$('memberTripEndDate').value||$('memberTripDate').value,title:$('memberTripTitle').value.trim(),boat:$('memberTripBoat').value.trim(),fee:Number($('memberTripFee').value),capacity:Number($('memberTripCapacity').value),extraSeats:Number($('memberTripExtraSeats').value),port:chosenPort,notes:$('memberTripNotes').value.trim()};
  if(!item.date||!item.title||!item.boat||$('memberTripFee').value===''||$('memberTripCapacity').value===''||!Number.isInteger(item.fee)||item.fee<0||!Number.isInteger(item.capacity)||item.capacity<2||item.capacity>100){msg('날짜, 출조명, 선사, 선비, 정원을 올바르게 입력해 주세요.');return;}
  if($('memberTripExtraSeats').value===''||!Number.isInteger(item.extraSeats)||item.extraSeats<0||1+item.extraSeats>item.capacity){msg('본인 포함 모집 정원을 초과할 수 없습니다.');return;}
  if(item.endDate<item.date){msg('종료일은 시작일 이후여야 합니다.');return;}
  if(!chosenPort){msg('출항지를 검색한 뒤 결과에서 선택해 주세요.');return;}
  if(!confirm('본인 포함 '+(1+item.extraSeats)+'명이 자동 확정됩니다. 출조를 등록하고 모집을 시작하시겠습니까?'))return;
  const button=$('memberTripSubmit');button.disabled=true;
  try{await call('createTrip',token,item);active='trips';await refresh();msg('출조 등록 완료');}
  catch(e){button.disabled=false;msg(e.message);}
}

function showTripDetail(id) {
  babaPush({kind:'detail',id,tab:active});
  const t = state.trips.find(x => x.id === id);
  if (!t || t.status === 'deleted') { msg('출조 일정을 찾을 수 없습니다.'); showTrips(); return; }

  const archived=isPastTrip(t);
  const canManage=canEditTrip(t)&&!archived;
  const regs = state.regs.filter(r => r.tripId === id);
  // 최초 신청 시각을 기준으로 정렬하고, 동일 시각이면 시트의 원래 행 순서를 사용합니다.
  // 취소 여부와 관계없이 신청 순서는 변하지 않습니다.
  const applicationOrder = (a,b) => String(a.createdAt||'').localeCompare(String(b.createdAt||'')) || Number(a.queueOrder||0)-Number(b.queueOrder||0);
  const applicants = regs.filter(r => ['confirmed', 'pending', 'cancel_requested', 'cancelled'].includes(r.status)).sort(applicationOrder);
  const cancelled = applicants.filter(r => r.status === 'cancelled');
  const waiting = regs.filter(r => r.status === 'waitlist').sort((a,b) => Number(a.queueOrder) - Number(b.queueOrder));
  const available = Math.max(0, Number(t.capacity) - Number(t.filled));
  const row = r => `
    <div style="padding:10px 0;border-bottom:1px solid #eee">
      <div class="row">
        <div>
          <b style="${r.status==='cancelled'?(String(r.legacyNote||'').includes('양도 전체 취소 →')?'color:#1769c2':'color:#c62828'):''}">${esc(r.displayName || '이름 없음')}</b>
          · ${Number(r.seats) || 1}명
          · <span style="${r.status==='cancelled'?(String(r.legacyNote||'').includes('양도 전체 취소 →')?'color:#1769c2;font-weight:700':'color:#c62828;font-weight:700'):''}">${r.status==='cancelled'&&String(r.legacyNote||'').includes('양도 전체 취소 →')?'양도 취소':esc(status(r.status))}</span>
          ${r.status==='cancelled'&&String(r.legacyNote||'').includes('양도 전체 취소 →')?`<div style="color:#1769c2;font-size:13px">양수자: ${esc((String(r.legacyNote).split('양도 전체 취소 →').pop()||'').split(' / ')[0])}</div>`:''}
          ${(state.transferHistory||[]).filter(x=>String(x.registrationId)===String(r.id)).map(x=>`<div style="color:#1769c2;font-size:13px">양도 승인: ${esc(x.toNickname)} · ${Number(x.seats)||1}명${x.decidedAt?' · '+esc(x.decidedAt):''}</div>`).join('')}
          ${admin() ? `<div class="muted">신청번호: ${esc(r.id)}</div>` : ''}
        </div>
        ${canManage && r.status === 'waitlist' ? `<div class="muted">대기 ${waiting.findIndex(x => x.id === r.id) + 1}순위 · ${Number(r.seats)||1}명 ${available>0 ? '· 확정 가능 '+Math.min(available,Number(r.seats)||1)+'명' : '· 빈자리 없음'}</div>` : ''}
        ${canManage && ['pending', 'confirmed', 'waitlist'].includes(r.status)
          ? `<button class="danger" data-admin-cancel="${esc(r.id)}">신청 취소</button>`
          : ''}
        ${canManage && r.status === 'pending' ? `<button data-creator-approve="${esc(r.id)}">신청 승인</button>` : ''}
        ${canManage && r.status === 'cancel_requested' ? `<button data-creator-cancel-decision="${esc(r.id)}" data-accept="true">취소 승인</button><button class="secondary" data-creator-cancel-decision="${esc(r.id)}" data-accept="false">취소 반려</button>` : ''}
        ${canManage && r.status === 'waitlist' ? `<button class="secondary" data-promote-waitlist="${esc(r.id)}" ${available < 1 || waiting[0]?.id !== r.id ? 'disabled' : ''}>${available>0&&available<Number(r.seats||1)?'부분 확정 ('+available+'명)':'대기자 확정'}</button>` : ''}
      </div>
    </div>`;

  $('view').innerHTML = `

async function deleteTrip(id) {
  if (!admin()) { msg('운영진만 출조를 삭제할 수 있습니다.'); return; }
  const t = state.trips.find(x => x.id === id);
  if (!t || t.status === 'deleted') { msg('출조 일정을 찾을 수 없습니다.'); return; }
  const count = state.regs.filter(r => r.tripId === id && ['pending','confirmed','waitlist','cancel_requested'].includes(r.status)).length;
  if (count > 0) {
    msg('현재 신청 또는 대기 중인 기록이 ' + count + '건 있어 삭제할 수 없습니다.');
    return;
  }
  if (!confirm('[' + t.title + '] 출조를 삭제 처리하시겠습니까?\n원본 데이터는 보존되고 회원 화면에서 숨겨집니다.')) return;
  const button = $('deleteTripButton');
  if (button) button.disabled = true;
  try {
    await call('deleteTripSafely', token, id);
    state = await call('data', token);
    showTrips();
    msg('출조가 안전 삭제 처리되었습니다.');
  } catch (e) {
    msg(e.message);
    if (button) button.disabled = false;
  }
}

function status(s){return ({pending:'승인 대기',confirmed:'확정',cancel_requested:'취소 승인 대기',waitlist:'대기',cancelled:'취소',paid:'입금 완료',partial:'부분 입금',unconfirmed:'입금 미확인'})[s]||s}
async function apply(id){if(pendingMember())return msg('가입 승인 후 신청할 수 있습니다.');const trip=state.trips.find(t=>t.id===id);if(!trip)return msg('출조 일정을 찾을 수 없습니다.');const raw=prompt('신청 인원 (1~'+trip.capacity+'명). 기존 확정 인원이 있으면 추가 신청으로 접수됩니다.','1');if(raw===null)return;const seats=Number(raw);if(!Number.isInteger(seats)||seats<1||seats>Number(trip.capacity))return msg('신청 인원은 1~'+trip.capacity+'명으로 입력하세요.');try{const r=await call('register',token,id,seats);msg(r.pendingSeats && r.waitlistSeats ? `신청 ${r.pendingSeats}명(승인 대기), 대기 ${r.waitlistSeats}명 접수` : r.status==='waitlist'?'대기 신청 완료':'신청 접수! 운영진 승인 대기');await refresh()}catch(e){msg(e.message)}}

let mineStatusFilter='active',mineSortOrder='asc';
function mineGroup(r){return r.status==='confirmed'?'confirmed':r.status==='pending'?'pending':r.status==='waitlist'?'waitlist':r.status==='cancel_requested'?'cancel_requested':'closed'}
function showMine(){
  const items=state.regs.filter(r=>String(r.memberId)===String(state.profile.id)&&validMyTrips().some(t=>String(t.id)===String(r.tripId)));

    const ad=String(state.trips.find(t=>String(t.id)===String(a.tripId))?.date||'');

  $('mineStatusFilter').value=mineStatusFilter;$('mineSortOrder').value=mineSortOrder;

  bindMineActions($('view'));
  if(validMyTrips().some(t=>String(t.creatorId)===String(state.profile.id))){$('view').insertAdjacentHTML('beforeend','<div class="card"><h3>내가 등록한 출조 · 취소 승인 요청</h3><p class="muted">본인이 등록한 출조의 취소 요청만 승인·반려할 수 있습니다.</p><div id="creatorCancellations">불러오는 중...</div></div>');loadCreatorCancellations()}
}

async function changeMineSeats(id){
  const r=state.regs.find(x=>String(x.id)===String(id)&&String(x.memberId)===String(state.profile.id));
  if(!r||!['pending','waitlist'].includes(r.status))return msg('승인 대기 또는 대기 중인 신청만 인원을 변경할 수 있습니다.');
  const raw=prompt(`변경할 신청 인원을 입력하세요. (현재 ${r.seats}명)`,String(r.seats));
  if(raw===null)return;
  const seats=Number(raw);
  if(!Number.isInteger(seats)||seats<1||seats>100)return msg('인원은 1~100명 사이의 정수로 입력하세요.');

  try{await call('changeRegistrationSeats',token,id,seats);await refresh();msg('신청 인원이 변경되었습니다.')}catch(e){msg(e.message)}

 const r=state.regs.find(x=>x.id===id);

    <label for="transferNickQuery">양수자 닉네임</label><div class="row"><input id="transferNickQuery" maxlength="30" placeholder="닉네임 2글자 이상" style="margin-right:6px"><button id="transferSearch">검색</button></div>

async function searchTransferNickname(){

  }catch(e){target.textContent='';msg(e.message)}
}
async function submitTransferChoice(index){
  const member=transferCandidates[index];if(!member||!transferRegistrationId)return;
  const own=state.regs.find(r=>String(r.id)===String(transferRegistrationId));
  const maxSeats=Number(own?.seats)||0,raw=$('transferSeats')?.value;
  const seats=Number(raw);
  if(raw===''||!Number.isInteger(seats)||seats<1||seats>maxSeats)return msg('양도할 자리는 1~'+maxSeats+'명 사이로 입력해 주세요.');
  const waiting=state.regs.filter(r=>String(r.tripId)===String(own?.tripId)&&r.status==='waitlist').sort((a,b)=>Number(a.queueOrder)-Number(b.queueOrder));
  if(waiting.length){
    const target=waiting.find(r=>String(r.memberId)===String(member.id));
    if(String(target?.id)!==String(waiting[0].id))return msg('1순위 대기자가 남아 있어 차순위에게 양도할 수 없습니다.');
    if(!target)return msg('대기자가 있는 출조는 대기 신청자에게만 양도할 수 있습니다.');
    if(seats>Number(target.seats))return msg('이 대기자는 '+target.seats+'명을 신청했습니다. 양도 자리 수는 '+target.seats+'명 이하여야 합니다.');
  }
  if(!confirm(`${member.nickname} 회원에게 ${seats}명 자리를 양도 요청하시겠습니까?\n${seats<maxSeats?'승인 후 본인에게 '+(maxSeats-seats)+'명 자리가 남습니다.':'승인 후 본인 신청은 취소 이력으로 남습니다.'}`))return;
  try{await call('requestTransfer',token,transferRegistrationId,member.id,'회원 닉네임 검색 요청',seats);transferRegistrationId=null;await refresh();showMine();msg('운영진에게 양도 승인 요청을 보냈습니다.')}catch(e){msg(e.message)}
}
function approvalGroupsHtml(){
  const regs=state.regs.filter(r=>r.status==='pending'&&state.trips.some(t=>String(t.id)===String(r.tripId)&&t.status!=='deleted'&&!isPastTrip(t)));
  const grouped=new Map();
  regs.forEach(r=>{if(!grouped.has(r.tripId))grouped.set(r.tripId,[]);grouped.get(r.tripId).push(r)});
  if(!grouped.size)return '<p class="muted">처리할 신청 승인 대기가 없습니다.</p>';
  const groups=Array.from(grouped.entries()).map(([tripId,items])=>({
    trip:state.trips.find(t=>t.id===tripId),items,tripId
  })).sort((a,b)=>String(a.trip?.date||'9999').localeCompare(String(b.trip?.date||'9999')));
  return groups.map(({trip,items,tripId})=>{
    const pending=items.filter(r=>r.status==='pending').length;
    const confirmed=items.filter(r=>r.status==='confirmed').length;

      <div class="approval-items">${items.map(r=>{

        return `<div class="approval-item"><b>${esc(r.displayName)}</b> · ${esc(status(r.status))}<div class="muted">${Number(r.seats)||0}명 · 선비 ${money(Number(trip?.fee||0)*(Number(r.seats)||1))}</div><div class="actions">${r.status==='pending'?`<button onclick="approveReg('${esc(r.id)}')">승인</button>`:''}${r.status==='cancel_requested'?`<button data-cancel-decision="${esc(r.id)}" data-request-name="${esc(r.displayName)}" data-accept="true">취소 승인</button><button class="secondary" data-cancel-decision="${esc(r.id)}" data-request-name="${esc(r.displayName)}" data-accept="false">반려 (출조 유지)</button>`:''}</div></div>`;

  target.querySelectorAll('[data-creator-cancel]').forEach(b=>b.addEventListener('click',()=>decideCancellationUI(b.dataset.creatorCancel,b.dataset.accept==='true',b)));

}

async function decideCancellationUI(id,accept,button){
 const reg=state.regs.find(r=>r.id===id);
 if(!confirm(`${button?.dataset?.requestName||reg?.displayName||'신청자'}의 취소 요청을 ${accept?'승인':'반려'}하시겠습니까?\n${accept?'승인 시 출조 자리가 반환됩니다. 자동 환불 및 대기자 승격은 없습니다.':'반려 시 기존 출조 확정이 유지됩니다.'}`))return;
 button.disabled=true;
 try{await call('decideCancellation',token,id,accept);const detailTrip=button.closest('#detailCreatorCancellations')?.dataset.tripId;await refresh();if(detailTrip)showTripDetail(detailTrip);msg(accept?'출조 취소를 승인했습니다.':'취소 요청을 반려했습니다.');}
 catch(e){button.disabled=false;msg(e.message)}
}
async function loadTransfers(){try{const a=await call('transferRequests',token);const target=$('transfers');if(!target)return;target.innerHTML=a.length?a.map(x=>{const trip=state.trips.find(t=>String(t.id)===String(x.tripId));return `<div class="approval-item"><div style="font-weight:700;overflow-wrap:anywhere">${esc(trip?.title||'출조 일정 확인 필요')}</div><div class="muted" style="overflow-wrap:anywhere">${esc(trip?tripDateRange(trip):'날짜 미확인')} · ${esc(trip?.boat||'선박 미등록')}</div><div style="margin-top:6px;overflow-wrap:anywhere">${esc(x.fromNickname)} → ${esc(x.toNickname)} · ${Number(x.seats)||1}명</div><div class="actions"><button onclick="decide('${x.id}',true)">승인</button><button class="danger" onclick="decide('${x.id}',false)">거절</button></div></div>`}).join(''):'대기 중인 양도 요청 없음'}catch(e){msg(e.message)}}
async function decide(id,accept){try{await call('decideTransfer',token,id,accept);msg('양도 요청 처리 완료');await refresh()}catch(e){msg(e.message)}}
function showAccount(){$('view').innerHTML=`<div class="card"><h2>바바 전용 닉네임</h2><p class="muted">카카오톡 닉네임과 별도로 사용합니다.</p><input id="babaNick" maxlength="20" value="${esc(state.profile.nickname)}"><button onclick="saveBabaNick()">닉네임 저장</button></div>${pendingMember()?'<div class="notice">가입 승인 대기 중입니다. 출조 일정과 출조왕 순위만 조회할 수 있습니다.</div>':''}<div class="card muted">회원번호: <span class="mono">${esc(state.profile.id)}</span></div>${state.profile.status==='active'?'<div class="card"><h2>내 출조 알림</h2><p id="tripPushHint" class="muted" role="status">이 기기의 알림 설정을 확인하고 있습니다.</p><button id="toggleTripPush" class="secondary" disabled>내 출조 알림 받기</button> <button id="tripPushPermissions" class="secondary" aria-expanded="false" aria-controls="tripPushPermissionGuide">휴대폰 알림 권한 설정</button><div id="tripPushPermissionGuide" hidden></div></div>':''}`;showTripPushSettings()}

function editTrip(id) {
  babaPush({kind:'edit',id,tab:active});
  editChosenPort=null;
  const t = state.trips.find(x => x.id === id);
  if (!canEditTrip(t)) {
    msg('본인이 등록한 출조만 수정할 수 있습니다.');
    return;
  }
  if (!t || t.status === 'deleted') {
    msg('출조 일정을 찾을 수 없습니다.');
    return;
  }

  $('view').innerHTML = `
    <div class="actions">
      <button class="secondary" id="cancelTripEdit">
        ← 상세 보기로 돌아가기
      </button>
    </div>

    <div class="card">
      <h2>출조 일정 수정</h2>

      <label>출조 시작일</label>
      <input type="date" id="editDate" value="${esc(t.date)}">
      <label>출조 종료일</label>
      <input type="date" id="editEndDate" value="${esc(t.endDate||t.date)}">
       <div class="notice">물때는 출조 날짜 변경 시 자동으로 다시 계산됩니다.</div>

      ${portSearchHtml("edit")}
      <label>출조명 / 어종</label>
      <input id="editTitle" value="${esc(t.title)}">

      <label>선사 / 선박</label>
      <input id="editBoat" value="${esc(t.boat)}">

      <label>선비 (원)</label>
      <input type="number" min="0" id="editFee"
             value="${Number(t.fee)}">

      <label>모집 정원</label>
      <input type="number" min="2" max="100"
             id="editCapacity" value="${Number(t.capacity)}">

      <label>모집 상태</label>
      <select id="editStatus">
        <option value="open">모집중</option>
        <option value="closed">모집마감</option>
        <option value="draft">모집전</option>
      </select>

      <label>안내사항</label>
      <textarea id="editNotes" rows="5"></textarea>

      <div class="actions">
        <button id="saveTripEdit">변경사항 저장</button>
        <button class="secondary" id="cancelTripEdit2">
          취소
        </button>
      </div>
    </div>
  `;

  if(t.departurePort){editChosenPort={name:t.departurePort,address:t.portAddress,lat:t.portLat,lng:t.portLng};$('editPortSelected').textContent='현재 출항지: '+t.departurePort+' · '+(t.portAddress||'');$('editPortQuery').value=t.departurePort;}
  $('editStatus').value = t.status;
  $('editNotes').value = t.notes || '';

  $('cancelTripEdit').onclick = () => {if(babaNavStack.length)goBabaBack();else showTripDetail(id)};
  $('cancelTripEdit2').onclick = () => {if(babaNavStack.length)goBabaBack();else showTripDetail(id)};
  $('saveTripEdit').onclick = () => saveTripEdit(id);
}

async function saveTripEdit(id) {
  if (!canEditTrip(state.trips.find(t => t.id === id))) {
    msg('본인이 등록한 출조만 수정할 수 있습니다.');
    return;
  }

  const fields = {
    date: $('editDate').value,
    endDate: $('editEndDate').value,
    title: $('editTitle').value.trim(),
    boat: $('editBoat').value.trim(),
    fee: Number($('editFee').value),
    capacity: Number($('editCapacity').value),
    status: $('editStatus').value,
    notes: $('editNotes').value,
    ...(editChosenPort?{port:editChosenPort}:{})
  };

  if (!fields.date || !fields.title ||
      $('editFee').value === '' ||
      $('editCapacity').value === '') {
    msg('필수 항목을 입력해 주세요.');
    return;
  }

  if(fields.endDate<fields.date){msg('종료일은 시작일 이후여야 합니다.');return;}
  if (!confirm('출조 일정을 수정하시겠습니까?')) return;

  const btn = $('saveTripEdit');
  btn.disabled = true;

  try {
    await call('changeTrip', token, id, fields);
    state = await call('data', token);
    render();
    showTripDetail(id);
    msg('출조 일정이 수정되었습니다.');
  } catch (e) {
    msg(e.message);
    btn.disabled = false;
  }
}

 out.innerHTML=list.length?list.map(x=>`<div class="approval-item row"><span>${esc(x.nickname)} <small>${esc(x.createdAt)}</small></span><span><button data-kakao-id="${esc(x.id)}" data-kakao-accept="true">승인</button> <button class="danger" data-kakao-id="${esc(x.id)}" data-kakao-accept="false">반려</button></span></div>`).join(''):'승인 대기 회원이 없습니다.';
 out.querySelectorAll('[data-kakao-id]').forEach(b=>b.onclick=async()=>{if(!confirm('이 회원의 가입을 '+(b.dataset.kakaoAccept==='true'?'승인':'반려')+'하시겠습니까?'))return;try{await call('decideKakaoMember',token,b.dataset.kakaoId,b.dataset.kakaoAccept==='true');const panel=$('kakaoPendingList')?.closest('.card');if(panel)panel.remove();await loadPendingKakaoUI();msg('처리 완료')}catch(e){msg(e.message)}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

// 낚시 게임은 사용자가 버튼을 누른 경우에만 실행합니다.
// 기존 출조 관리 화면의 자동 시작/인증 동작에는 영향을 주지 않습니다.
let babaGameOpening = false;
async function launchBabaGameFromTrips(){
  if(babaGameOpening)return;
  if(!token || !state)return msg('카카오 로그인 후 이용해 주세요.');
  if(state.profile?.status !== 'active')return msg('운영진 가입 승인 후 이용할 수 있습니다.');
  babaGameOpening=true;
  const button=$('babaGameEntry');
  if(button)button.disabled=true;
  // 팝업 차단 방지를 위해 사용자 클릭과 동시에 창을 생성합니다.
  let gameWindow=null;
  try {gameWindow=window.open('about:blank','_blank');}catch(e){}
  try{
    const response=await call('babaGameLaunch',token);
    if(!response || typeof response.url!=='string' || !/^https:\/\/lee36848759-hub\.github\.io\/baba-fishing-game\/#launch=/.test(response.url))
      throw new Error('게임 접속 주소를 확인할 수 없습니다.');
    if(gameWindow && !gameWindow.closed){gameWindow.location.replace(response.url);}
    else {window.location.assign(response.url);}
  }catch(e){
    if(gameWindow && !gameWindow.closed)gameWindow.close();
    msg('낚시 게임 연결 실패: '+(e?.message||String(e)));
  }finally{
    babaGameOpening=false;
    if(button)button.disabled=false;
  }
}
